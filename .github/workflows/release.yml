name: release-android

on:
  push:
    branches:
      - flutter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  VERSION_FILE: VERSION

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/upload-keystore.jks
          EOF

      - name: Resolve version
        id: version
        # 对齐 SmartVault：major.minor 取自 VERSION 文件，patch 位用 run_number，
        # 每次推送发布版本号自动递增，无需手工改 VERSION。
        run: |
          RAW=$(cat "$VERSION_FILE" | tr -d '[:space:]')
          if [[ ! "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            RAW=$(date -u +%Y.%-m.1)
          fi
          VERSION="${RAW%.*}.${GITHUB_RUN_NUMBER}"
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="v${VERSION}-build-${TIMESTAMP}-${SHORT_SHA}"
          APK_NAME="MyItems-${VERSION}-${TIMESTAMP}.apk"
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name "${{ steps.version.outputs.version }}"
          --build-number "${{ steps.version.outputs.build_number }}"
          --dart-define "APP_VERSION=${{ steps.version.outputs.version }}"

      - name: Prepare artifacts
        run: |
          mkdir -p publish
          cp build/app/outputs/flutter-apk/app-release.apk "publish/${{ steps.version.outputs.apk_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyItems-android-release
          path: publish/${{ steps.version.outputs.apk_name }}
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "MyItems ${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          files: publish/${{ steps.version.outputs.apk_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
